name: Deploy Documentation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout Nyte Server
        uses: actions/checkout@v7
        with:
          repository: use-nyte/nyte-server
          ref: main
          path: .sources/nyte-server
          persist-credentials: false

      - name: Checkout Nyte Web
        uses: actions/checkout@v7
        with:
          repository: use-nyte/nyte-web
          ref: main
          path: .sources/nyte-web
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: "@use-nyte"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Install Nyte Server dependencies
        run: pnpm --dir .sources/nyte-server install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Generate Nyte Server API
        run: pnpm --dir .sources/nyte-server run docs:build

      - name: Install Nyte Web dependencies
        run: pnpm --dir .sources/nyte-web install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Generate Nyte Web API
        run: pnpm --dir .sources/nyte-web run docs:build

      - name: Synchronize repository documentation
        run: pnpm run docs:sync

      - name: Build Docusaurus
        run: pnpm run build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    name: Deploy Documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
